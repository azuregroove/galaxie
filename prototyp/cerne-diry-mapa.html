<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Černé díry Mléčné dráhy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D star chart; instrument panels float over it (list left, readout card right, scale + controls bottom). Deliberately single dark theme: it is a night-sky instrument. */
:root{
  --void:#05070d;
  --panel:rgba(12,16,28,.86);
  --line:rgba(150,170,220,.18);
  --fg:#dfe6f5;
  --dim:#8391ad;
  --accent:#8fb4ff;
  --rtg:#58c7ff;
  --spici:#b894ff;
  --cocka:#5fe0a6;
  --imbh:#ff9a5c;
  --smbh:#ffe9b0;
  --sun:#ffd257;
  --ecl:#f2b84b;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;margin:0}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font:500 11px/1.2 var(--f-mono);color:var(--fg);white-space:nowrap;transform:translate(8px,-50%);text-shadow:0 0 4px #000,0 0 2px #000;letter-spacing:.02em}
.lbl.sel{color:#fff;font-weight:600;font-size:12px}
.lbl.anno{color:var(--dim);font-family:var(--f-body);font-size:11px;transform:translate(-50%,-50%);text-align:center}
.lbl.ring{color:rgba(170,190,230,.75);font-size:10px;transform:translate(4px,-100%)}
.lbl.ecl{color:var(--ecl)}
.lbl.sun{color:var(--sun);font-weight:600}

.hud{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
header.hud{top:calc(12px + env(safe-area-inset-top,0px));left:12px;padding:10px 14px;max-width:min(360px,calc(100vw - 24px))}
h1{font:600 18px/1.15 var(--f-display);margin:0;letter-spacing:.03em;text-wrap:balance}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--f-mono);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:99px;padding:3px 9px;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip[aria-pressed="false"]{opacity:.4}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#listPanel{top:calc(150px + env(safe-area-inset-top,0px));left:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:300px;display:flex;flex-direction:column}
#listPanel h2{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 14px 6px}
#list{overflow-y:auto;padding:0 6px 8px;flex:1;min-height:0}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:6px 8px;border-radius:6px;cursor:pointer;font:400 12.5px var(--f-body)}
.row:hover{background:rgba(143,180,255,.08)}
.row.on{background:rgba(143,180,255,.16)}
.row i{width:8px;height:8px;border-radius:50%}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ds{font:400 11px var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}

#card{top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:320px;padding:14px 16px;max-height:calc(100% - 110px);overflow-y:auto}
#card h3{font:600 17px/1.2 var(--f-display);margin:0 0 2px;letter-spacing:.02em}
#card .kind{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:12px 0 10px;font-size:12.5px}
#card dt{color:var(--dim)}
#card dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#card p{margin:0;font-size:12.5px;line-height:1.5;color:#c3cce0}
#card .src{margin-top:8px;font-size:11px;color:var(--dim)}
#card .close{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;width:28px;height:28px;border-radius:6px}
.status{display:inline-block;font:500 10.5px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}

#bar{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:500 12px var(--f-body);color:var(--fg);background:rgba(143,180,255,.08);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{background:rgba(143,180,255,.18)}
.btn[aria-pressed="true"]{background:rgba(143,180,255,.24);border-color:rgba(143,180,255,.5)}
.sep{width:1px;height:22px;background:var(--line)}
#scale{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font:500 11px var(--f-mono);font-variant-numeric:tabular-nums}
#scaleLine{height:6px;border:1px solid var(--fg);border-top:0}
#readout{font:400 11px var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
.help{font-size:11px;color:var(--dim)}
#listToggle{display:none}

@media (max-width:760px){
  header.hud{right:12px;max-width:none}
  #listPanel{top:auto;left:12px;right:12px;width:auto;bottom:calc(128px + env(safe-area-inset-bottom,0px));height:42vh}
  #listPanel.closed{display:none}
  #listToggle{display:inline-block}
  #card{left:12px;right:12px;width:auto;top:auto;bottom:calc(128px + env(safe-area-inset-bottom,0px));max-height:45vh}
  .help{display:none}
  #scale{margin-left:0}
}
@media (max-width:760px){ #listPanel.closed + #card{} }
</style>

<div id="stage"></div>
<div id="labels"></div>

<header class="hud">
  <h1>Černé díry Mléčné dráhy</h1>
  <div class="sub">37 hvězdných černých děr a kandidátů, poloha vůči Slunci</div>
  <div class="legend" id="legend"></div>
</header>

<aside class="hud" id="listPanel" aria-label="Seznam černých děr">
  <h2>Od nejbližší</h2>
  <div id="list"></div>
</aside>

<section class="hud" id="card" hidden aria-live="polite"></section>

<nav class="hud" id="bar">
  <div class="btns">
    <button class="btn" id="listToggle" aria-pressed="false">Seznam</button>
    <button class="btn" data-view="sun">Slunce</button>
    <button class="btn" data-view="top">Shora</button>
    <button class="btn" data-view="edge">Z boku</button>
    <button class="btn" data-view="gc">Centrum</button>
  </div>
  <div class="sep"></div>
  <div class="btns">
    <button class="btn" data-tog="labels" aria-pressed="true">Popisky</button>
    <button class="btn" data-tog="ecl" aria-pressed="true">Ekliptika</button>
    <button class="btn" data-tog="rings" aria-pressed="true">Kruhy</button>
    <button class="btn" data-tog="dims" aria-pressed="true">Rozměry</button>
  </div>
  <span class="help">Tah myší = otáčení · kolečko = zoom · pravé tl. = posun · WASD/QE = let · klik na objekt = přelet</span>
  <div id="scale"><div id="scaleTxt">–</div><div id="scaleLine"></div><div id="readout"></div></div>
</nav>

stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(css("--void"));
const camera = new THREE.PerspectiveCamera(50,1,5,1e6);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 40; controls.maxDistance = 300000;
controls.screenSpacePanning = true;

function glowTex(){
  const c=document.createElement("canvas");c.width=c.height=64;const g=c.getContext("2d");
  const r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,"rgba(255,255,255,1)");r.addColorStop(.25,"rgba(255,255,255,.55)");r.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();

// ---------- galaxy point cloud (schematic) ----------
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
(function buildGalaxy(){
  const N=110000, pos=new Float32Array(N*3), col=new Float32Array(N*3), siz=new Float32Array(N);
  const k=Math.tan(12*Math.PI/180);
  // arm phase chosen so one arm crosses the Sun's azimuth at ~22 500 ly and the next at ~31 400 ly (Sun sits between them)
  const r0=22500, phases=[Math.PI, Math.PI/2, 0, -Math.PI/2];
  const warm=new THREE.Color("#ffd9a0"), blue=new THREE.Color("#a9c4ff"), white=new THREE.Color("#e8ecff"), pink=new THREE.Color("#ff9fc8");
  const barAng = -27*Math.PI/180; // near end of bar toward positive l
  for(let i=0;i<N;i++){
    let x,y,z,c,s=1;
    const t=rnd();
    if(t<0.18){ // bulge / bar
      const a=gauss()*9000, b=gauss()*3500, h=gauss()*2200;
      x=a*Math.cos(barAng)-b*Math.sin(barAng); z=a*Math.sin(barAng)+b*Math.cos(barAng); y=h;
      c=warm.clone().lerp(white,rnd()*.3); s=1.2;
    } else if(t<0.72){ // arms
      const arm=Math.floor(rnd()*4);
      const r=3500+Math.pow(rnd(),0.8)*(DISK_R+4000-3500);
      const phi=phases[arm]-Math.log(r/r0)/k;
      const spread=700+r*0.045;
      const px=Math.cos(phi)*r, pz=Math.sin(phi)*r;
      x=px+gauss()*spread; z=pz+gauss()*spread; y=gauss()*(260+r*0.004);
      c=blue.clone().lerp(white,rnd()*.6); if(rnd()<0.05)c=pink.clone();
      s=0.9;
    } else if(t<0.76){ // Orion–Cygnus spur through the Sun
      const u=rnd()*9000-4500;
      const ang=Math.PI+0.2;
      x=SUN.x+Math.cos(ang)*u*0.4+gauss()*700; z=SUN.z+u+gauss()*700; y=gauss()*250;
      c=blue.clone().lerp(white,.5); s=0.8;
    } else { // diffuse disk
      const r=Math.sqrt(rnd())*(DISK_R+6000), phi=rnd()*Math.PI*2;
      x=Math.cos(phi)*r; z=Math.sin(phi)*r; y=gauss()*350;
      c=white.clone().lerp(warm,rnd()*.4).multiplyScalar(.55); s=0.7;
    }
    pos.set([x,y,z],i*3); col.set([c.r,c.g,c.b],i*3); siz[i]=s;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  g.setAttribute("sz",new THREE.BufferAttribute(siz,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{map:{value:GLOW},scale:{value:1}},
    vertexShader:`attribute float sz;varying vec3 vC;uniform float scale;
      void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=clamp(sz*scale*260./-mv.z,1.,5.);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D map;varying vec3 vC;
      void main(){vec4 t=texture2D(map,gl_PointCoord);gl_FragColor=vec4(vC*.55,t.a*.8);}`,
    vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  });
  m.onBeforeCompile=()=>{};
  scene.add(new THREE.Points(g,m));
  window.__galMat=m;
})();

// ---------- helpers for lines ----------
function circle(center,radius,normal,color,opacity,seg=160,dashed=false){
  const pts=[];const n=normal.clone().normalize();
  const a=Math.abs(n.y)<.99?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const u=new THREE.Vector3().crossVectors(n,a).normalize(), v=new THREE.Vector3().crossVectors(n,u);
  for(let i=0;i<=seg;i++){const t=i/seg*Math.PI*2;pts.push(center.clone().addScaledVector(u,Math.cos(t)*radius).addScaledVector(v,Math.sin(t)*radius));}
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const m=dashed?new THREE.LineDashedMaterial({color,transparent:true,opacity,dashSize:radius*.03,gapSize:radius*.02,depthWrite:false})
               :new THREE.LineBasicMaterial({color,transparent:true,opacity,depthWrite:false});
  const l=new THREE.Line(g,m); if(dashed)l.computeLineDistances(); return l;
}
function seg(a,b,color,opacity,dashed=false){
  const g=new THREE.BufferGeometry().setFromPoints([a,b]);
  const m=dashed?new THREE.LineDashedMaterial({color,transparent:true,opacity,dashSize:400,gapSize:300,depthWrite:false})
               :new THREE.LineBasicMaterial({color,transparent:true,opacity,depthWrite:false});
  const l=new THREE.Line(g,m); if(dashed)l.computeLineDistances(); return l;
}
const UP=new THREE.Vector3(0,1,0);

// ---------- overlays ----------
const labelsEl=document.getElementById("labels");
const annos=[]; // {pos, el, group}
function addLabel(text,pos,cls,group){const el=document.createElement("div");el.className="lbl "+cls;el.textContent=text;labelsEl.appendChild(el);const a={pos,el,group};annos.push(a);return a;}

const groups={rings:new THREE.Group(),ecl:new THREE.Group(),dims:new THREE.Group()};
Object.values(groups).forEach(g=>scene.add(g));

// galactocentric faint grid
for(let r=10000;r<=50000;r+=10000) scene.add(circle(new THREE.Vector3(),r,UP,0x3b4a70,.35,200));
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;scene.add(seg(new THREE.Vector3(Math.cos(a)*2000,0,Math.sin(a)*2000),new THREE.Vector3(Math.cos(a)*50000,0,Math.sin(a)*50000),0x3b4a70,.18));}

// Sun-centred distance rings in the galactic plane
[1000,5000,10000,20000,40000].forEach(r=>{
  groups.rings.add(circle(SUN,r,UP,0x8fb4ff,.35,180,true));
  addLabel(`${fmt(r)} ly · ${fmtPc(r)}`, SUN.clone().add(new THREE.Vector3(0,0,r)), "ring","rings");
});
// longitude ticks around Sun
[0,90,180,270].forEach(l=>{
  const d=dirLB(l,0);groups.rings.add(seg(SUN.clone().addScaledVector(d,300),SUN.clone().addScaledVector(d,5200),0x8fb4ff,.3));
  addLabel(`l = ${l}°`,SUN.clone().addScaledVector(d,5800),"anno","rings");
});

// ecliptic plane (orientation only; north ecliptic pole at l=96.385°, b=29.806°)
const NEP=dirLB(96.385,29.806);
(function(){
  const R=2000;
  const geo=new THREE.CircleGeometry(R,96);
  const mat=new THREE.MeshBasicMaterial({color:css("--ecl"),transparent:true,opacity:.07,side:THREE.DoubleSide,depthWrite:false});
  const disk=new THREE.Mesh(geo,mat);disk.position.copy(SUN);disk.lookAt(SUN.clone().add(NEP));groups.ecl.add(disk);
  groups.ecl.add(circle(SUN,R,NEP,css("--ecl"),.8));
  groups.ecl.add(seg(SUN,SUN.clone().addScaledVector(NEP,1800),css("--ecl"),.7));
  addLabel("Rovina ekliptiky · sklon 60,2° ke galaktické rovině",SUN.clone().addScaledVector(NEP,-600).add(new THREE.Vector3(0,-R*0.55,0)),"anno ecl","ecl");
  addLabel("sev. pól ekliptiky",SUN.clone().addScaledVector(NEP,2000),"anno ecl","ecl");
})();

// galaxy dimensions
(function(){
  const c=0x9aa8c8;
  const zOff=-DISK_R-3000;
  groups.dims.add(seg(new THREE.Vector3(-DISK_R,0,zOff),new THREE.Vector3(DISK_R,0,zOff),c,.7));
  groups.dims.add(seg(new THREE.Vector3(-DISK_R,0,zOff-1200),new THREE.Vector3(-DISK_R,0,zOff+1200),c,.7));
  groups.dims.add(seg(new THREE.Vector3(DISK_R,0,zOff-1200),new THREE.Vector3(DISK_R,0,zOff+1200),c,.7));
  addLabel("průměr disku ≈ 87 400 ly · 26,8 kpc",new THREE.Vector3(0,0,zOff-2500),"anno","dims");
  // thickness brackets at the far edge (along -X side beyond the Sun)
  const x=DISK_R+4000;
  const thin=1100/2, thick=8500/2;
  groups.dims.add(seg(new THREE.Vector3(x,-thin,0),new THREE.Vector3(x,thin,0),0xcfd8ff,.9));
  [-thin,thin].forEach(y=>groups.dims.add(seg(new THREE.Vector3(x-600,y,0),new THREE.Vector3(x+600,y,0),0xcfd8ff,.9)));
  groups.dims.add(seg(new THREE.Vector3(x+2500,-thick,0),new THREE.Vector3(x+2500,thick,0),c,.5,true));
  [-thick,thick].forEach(y=>groups.dims.add(seg(new THREE.Vector3(x+1900,y,0),new THREE.Vector3(x+3100,y,0),c,.5)));
  addLabel("tenký disk ≈ 700–1 500 ly · 220–450 pc",new THREE.Vector3(x,thin+900,0),"anno","dims");
  addLabel("tlustý disk ≈ 8 500 ly · 2,6 kpc",new THREE.Vector3(x+2500,thick+900,0),"anno","dims");
  addLabel("Rameno Orionu–Labutě (místní)",SUN.clone().add(new THREE.Vector3(-2200,0,-5200)),"anno","dims");
  addLabel("ramena jsou schematická",new THREE.Vector3(DISK_R*.55,0,DISK_R*.62),"anno","dims");
})();

// Sun & Sgr A* markers
function glowSprite(color,size){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));s.scale.set(size,size,1);return s;}
const sunSpr=glowSprite(css("--sun"),520);sunSpr.position.copy(SUN);scene.add(sunSpr);
addLabel("Slunce",SUN,"sun","base");

// ---------- black holes ----------
const bhObjs=[];
BH.forEach((o,i)=>{
  const col=new THREE.Color(css(TYPES[o.t].c));
  if(o.pos){
    const base = o.t==="smbh"?900 : o.t==="imbh"?520 : 160+Math.log10(o.m+1)*170;
    const spr=glowSprite(col,base);spr.position.copy(o.pos);scene.add(spr);
    const core=new THREE.Mesh(new THREE.SphereGeometry(base*.09,12,12),new THREE.MeshBasicMaterial({color:0x000000}));
    core.position.copy(o.pos);scene.add(core);
    const foot=new THREE.Vector3(o.pos.x,0,o.pos.z);
    const drop=seg(o.pos,foot,col,.45);scene.add(drop);
    const tick=circle(foot,90,UP,col,.6,24);scene.add(tick);
    o.spr=spr;o.parts=[spr,core,drop,tick];o.base=base;
  } else {
    const end=SUN.clone().addScaledVector(o.dir,40000);
    const ray=seg(SUN,end,col,.55,true);scene.add(ray);
    o.parts=[ray];o.rayEnd=SUN.clone().addScaledVector(o.dir,12000);
  }
  o.label=addLabel(o.pos?o.n:o.n+" (jen směr)",o.pos||o.rayEnd,"","bh");
  o.label.o=o;
  bhObjs.push(o);
});

// ---------- UI: legend / filters ----------
const active={rtg:true,spici:true,cocka:true,imbh:true,smbh:true};
const legend=document.getElementById("legend");
Object.entries(TYPES).forEach(([k,t])=>{
  const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed","true");
  b.innerHTML=`<i style="background:var(${t.c})"></i>${t.name}`;
  b.onclick=()=>{active[k]=!active[k];b.setAttribute("aria-pressed",active[k]);applyFilter();};
  legend.appendChild(b);
});
function applyFilter(){
  bhObjs.forEach(o=>{const v=active[o.t];o.parts.forEach(p=>p.visible=v);o.hidden=!v;});
  renderList();
}

// ---------- list ----------
const listEl=document.getElementById("list");
let selected=null;
function renderList(){
  listEl.innerHTML="";
  const sorted=[...bhObjs].sort((a,b)=>(a.d??1e9)-(b.d??1e9));
  sorted.forEach(o=>{
    if(o.hidden)return;
    const r=document.createElement("button");r.className="row"+(o===selected?" on":"");
    r.innerHTML=`<i style="background:var(${TYPES[o.t].c})"></i><span class="nm">${o.n}</span><span class="ds">${o.d?fmt(o.d)+" ly":"?"}</span>`;
    r.onclick=()=>select(o,true);
    listEl.appendChild(r);
  });
}

// ---------- info card ----------
const card=document.getElementById("card");
function select(o,fly){
  selected=o;renderList();
  const h=o.pos?o.pos.y:null;
  const dGC=o.pos?o.pos.length():null;
  card.innerHTML=`<button class="close" aria-label="Zavřít">×</button>
    <div class="kind" style="color:var(${TYPES[o.t].c})">${TYPES[o.t].name}</div>
    <h3>${o.n}</h3>
    <dl>
      <dt>Od Slunce</dt><dd>${o.d?`${o.dl} ly<br>${fmtPc(o.d)}`:"neznámá"}</dd>
      <dt>Hmotnost</dt><dd>${o.ml} M☉</dd>
      <dt>Status</dt><dd>${o.s}</dd>
      <dt>Gal. souřadnice</dt><dd>l ${o.l.toFixed(2)}° · b ${o.b>=0?"+":""}${o.b.toFixed(2)}°</dd>
      ${o.pos?`<dt>Výška nad rovinou</dt><dd>${h>=0?"+":"−"}${fmt(Math.abs(h))} ly · ${h>=0?"+":"−"}${fmtPc(Math.abs(h))}</dd>
      <dt>Od centra Galaxie</dt><dd>${fmt(dGC)} ly · ${fmtPc(dGC)}</dd>`:""}
    </dl>
    <p>${o.no}</p>
    <div class="src">${({wiki:"Poloha: souřadnice RA/Dec z Wikipedie.",j2000name:"Poloha: odvozena z označení J2000 (přesnost cca 0,1–1°).",b1950name:"Poloha: odvozena z označení B1950, přepočtena na J2000.",galname:"Poloha: z galaktického označení GX.",memory:"Poloha: z paměti, neověřeno."})[o.src]}</div>`;
  card.hidden=false;
  card.querySelector(".close").onclick=()=>{card.hidden=true;selected=null;renderList();};
  if(fly)flyTo(o.pos||o.rayEnd, o.t==="smbh"?9000:3500);
}

// ---------- camera flights ----------
let flight=null;
function flyTo(target,dist,dirOverride){
  const dir=dirOverride?dirOverride.clone().normalize():camera.position.clone().sub(controls.target).normalize();
  flight={t0:performance.now(),dur:matchMedia("(prefers-reduced-motion: reduce)").matches?1:1300,
    fromP:camera.position.clone(),fromT:controls.target.clone(),toT:target.clone(),toP:target.clone().addScaledVector(dir,dist)};
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const views={
  sun:()=>flyTo(SUN,14000,new THREE.Vector3(-0.35,0.75,0.55)),
  top:()=>flyTo(new THREE.Vector3(0,0,0),125000,new THREE.Vector3(0.0001,1,0.02)),
  edge:()=>flyTo(new THREE.Vector3(0,0,0),95000,new THREE.Vector3(0.02,0.04,1)),
  gc:()=>flyTo(new THREE.Vector3(0,0,0),20000,new THREE.Vector3(-0.6,0.5,0.6))
};
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>views[b.dataset.view]());
const show={labels:true,ecl:true,rings:true,dims:true};
document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.tog;show[k]=!show[k];b.setAttribute("aria-pressed",show[k]);
  if(groups[k])groups[k].visible=show[k];
});
const listPanel=document.getElementById("listPanel"),listToggle=document.getElementById("listToggle");
if(matchMedia("(max-width:760px)").matches)listPanel.classList.add("closed");
listToggle.onclick=()=>{const c=listPanel.classList.toggle("closed");listToggle.setAttribute("aria-pressed",!c);};

// ---------- picking ----------
let downAt=null;
renderer.domElement.addEventListener("pointerdown",e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener("pointerup",e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5)return;
  const rect=renderer.domElement.getBoundingClientRect();
  let best=null,bd=22;
  bhObjs.forEach(o=>{ if(o.hidden)return; const p=(o.pos||o.rayEnd).clone().project(camera); if(p.z>1)return;
    const x=(p.x+1)/2*rect.width,y=(1-p.y)/2*rect.height; const d=Math.hypot(x-(e.clientX-rect.left),y-(e.clientY-rect.top)); if(d<bd){bd=d;best=o;} });
  if(best)select(best,true);
});

// ---------- keyboard flight ----------
const keys={};
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;keys[e.key.toLowerCase()]=true;});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function keyMove(dt){
  const f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;if(f.lengthSq()<1e-6)f.set(0,0,-1);f.normalize();
  const r=new THREE.Vector3().crossVectors(f,UP).normalize();
  const m=new THREE.Vector3();
  if(keys.w||keys.arrowup)m.add(f); if(keys.s||keys.arrowdown)m.sub(f);
  if(keys.d||keys.arrowright)m.add(r); if(keys.a||keys.arrowleft)m.sub(r);
  if(keys.e)m.y+=1; if(keys.q)m.y-=1;
  if(m.lengthSq()===0)return;
  const speed=camera.position.distanceTo(controls.target)*0.9*dt;
  m.normalize().multiplyScalar(speed);
  camera.position.add(m);controls.target.add(m);flight=null;
}

// ---------- scale bar ----------
const scaleTxt=document.getElementById("scaleTxt"),scaleLine=document.getElementById("scaleLine"),readout=document.getElementById("readout");
function updateScale(h){
  const dist=camera.position.distanceTo(controls.target);
  const worldH=2*dist*Math.tan(camera.fov*Math.PI/360);
  const lyPx=worldH/h;
  const raw=lyPx*130, p=Math.pow(10,Math.floor(Math.log10(raw)));
  const nice=[5,2,1].map(x=>x*p).find(x=>x<=raw)||p;
  scaleLine.style.width=(nice/lyPx).toFixed(0)+"px";
  scaleTxt.textContent=`${fmt(nice)} ly · ${fmtPc(nice)}`;
  const ds=controls.target.distanceTo(SUN);
  readout.textContent=`střed pohledu: ${fmt(ds)} ly od Slunce`;
}

// ---------- resize & loop ----------
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener("resize",resize);resize();
camera.position.copy(SUN).add(new THREE.Vector3(-14000,52000,42000));
controls.target.copy(SUN).add(new THREE.Vector3(9000,0,0));
controls.update();

const tmp=new THREE.Vector3();
const MAJOR=new Set(["Gaia BH1","Gaia BH3","Cygnus X-1","GRS 1915+105","Sagittarius A*","Omega Centauri (IMBH)","A0620-00 (V616 Mon)","V404 Cygni"]);
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(flight){const t=Math.min(1,(now-flight.t0)/flight.dur),k=ease(t);
    controls.target.lerpVectors(flight.fromT,flight.toT,k);camera.position.lerpVectors(flight.fromP,flight.toP,k);if(t>=1)flight=null;}
  keyMove(dt);
  controls.update();
  const camDist=camera.position.distanceTo(controls.target);
  // keep BH glows readable at every zoom
  bhObjs.forEach(o=>{ if(!o.spr)return; const d=camera.position.distanceTo(o.pos); const s=Math.max(o.base, d*0.012*(o.t==="smbh"?2:1)); o.spr.scale.set(s,s,1); });
  sunSpr.scale.setScalar(Math.max(520,camera.position.distanceTo(SUN)*0.02));
  renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;
  annos.forEach(a=>{
    let vis = a.group==="base" || (a.group==="bh" ? show.labels && !a.o.hidden : show[a.group]);
    if(vis && a.group==="bh"){ const o=a.o; const d=camera.position.distanceTo(a.pos); vis = o===selected || MAJOR.has(o.n) || (camDist<30000 && d<camDist*1.1); }
    if(vis){ tmp.copy(a.pos).project(camera); if(tmp.z>1||Math.abs(tmp.x)>1.2||Math.abs(tmp.y)>1.2)vis=false; }
    if(!vis){ if(a.el.style.display!=="none")a.el.style.display="none"; return; }
    a.el.style.display="";
    a.el.style.transform=`translate(${((tmp.x+1)/2*w).toFixed(1)}px,${((1-tmp.y)/2*h).toFixed(1)}px) ${a.el.classList.contains("anno")?"translate(-50%,-50%)":a.el.classList.contains("ring")?"translate(4px,-100%)":"translate(8px,-50%)"}`;
    a.el.classList.toggle("sel",a.group==="bh"&&a.o===selected);
  });
  updateScale(h);
  requestAnimationFrame(loop);
}
renderList();
requestAnimationFrame(loop);
</script>
